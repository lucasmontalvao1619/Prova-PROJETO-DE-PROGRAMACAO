<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Pessoal</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
    <h1>Orçamento Pessoal</h1>
    <p>API REST em Java com Spring Boot</p>
</header>

<main>

    <section class="cards">
        <article><span>Saldo</span><strong id="saldo">R$ 0,00</strong></article>
        <article><span>Receitas</span><strong id="receitas" class="receita">R$ 0,00</strong></article>
        <article><span>Despesas</span><strong id="despesas" class="despesa">R$ 0,00</strong></article>
    </section>

    <section class="painel">
        <h2 id="tituloFormulario">Novo lançamento</h2>
        <form id="formulario">
            <input type="hidden" id="id">
            <div class="linha">
                <label>Descrição<input type="text" id="descricao" placeholder="Mercado" required></label>

                <label>Valor (R$)<input type="number" id="valor" step="0.01" min="0.01" required></label>
                <label>Categoria<select id="categoria" required></select></label>
            </div>
            <div class="botoes">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelar" class="secundario" hidden>Cancelar</button>
            </div>
            <p id="erro" hidden></p>
        </form>
    </section>

    <section class="painel">
        <h2>Lançamentos</h2>
        <table>
            <thead>
            <tr><th>Descrição</th><th>Categoria</th><th class="direita">Valor</th><th></th></tr>
            </thead>
            <tbody id="listaTransacoes"></tbody>
        </table>
        <p id="listaVazia" class="vazio" hidden>Nenhum lançamento ainda.</p>
    </section>

    <section class="painel">
        <h2>Gastos por categoria</h2>
        <ul id="gastos"></ul>
        <p id="gastosVazio" class="vazio" hidden>Nenhuma despesa registrada.</p>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
